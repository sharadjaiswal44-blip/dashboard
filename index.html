<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script>(function(){var r=document.documentElement;r.dataset.theme="light";try{if(localStorage.getItem("ws-theme")==="dark")r.dataset.theme="dark"}catch(e){}})();</script>
<title>1Cell.Ai Website Insights</title>
<meta name="description" content="Website traffic, Google Search and content performance insights for 1Cell.Ai leadership (Jul 8 – Oct 5, 2026).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: sticky brand bar + tab strip; each tab is one screen of summary tiles, then 2-column chart/insight panels that stack on phones. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef2f8; --line:#dfe5ee;
  --ink:#13233f; --ink-2:#4a5a74; --ink-3:#7a879c;
  --navy:#1b365d; --gold:#c9940c; --gold-soft:#fbf3dc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s1-soft:rgba(42,120,214,.12);
  --good:#127a4a; --good-soft:#e3f4ea;
  --f-display:"Outfit","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(19,35,63,.05),0 6px 20px rgba(19,35,63,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1524; --surface:#141f33; --surface-2:#1b2840; --line:#26354f;
  --ink:#eef2f9; --ink-2:#b4c0d3; --ink-3:#8593a9;
  --navy:#9fbbe6; --gold:#e6b743; --gold-soft:rgba(230,183,67,.13);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s1-soft:rgba(57,135,229,.18);
  --good:#4fcf8e; --good-soft:rgba(79,207,142,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1524; --surface:#141f33; --surface-2:#1b2840; --line:#26354f;
  --ink:#eef2f9; --ink-2:#b4c0d3; --ink-3:#8593a9;
  --navy:#9fbbe6; --gold:#e6b743; --gold-soft:rgba(230,183,67,.13);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s1-soft:rgba(57,135,229,.18);
  --good:#4fcf8e; --good-soft:rgba(79,207,142,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{height:40px;width:auto;background:#fff;border-radius:10px;padding:4px 8px}
.top-title{display:flex;flex-direction:column;min-width:0}
.top-title h1{font-size:clamp(1.3rem,2.6vw,1.6rem);font-weight:600;line-height:1.2}
.top-title span{font-size:.8rem;color:var(--ink-3)}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.period{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);background:var(--surface-2);padding:6px 10px;border-radius:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:6px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;font:600 .9rem var(--f-body);color:var(--ink-3);padding:10px 14px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab:focus-visible,.chip:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

main{padding-block:24px 48px}
.panel{display:grid;gap:20px}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.intro h2{font-size:clamp(1.35rem,2.4vw,1.75rem);font-weight:600}
.intro p{margin:4px 0 0;color:var(--ink-2);max-width:68ch}
.src{font-size:.75rem;color:var(--ink-3)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.kpi-value{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-value small{font-size:1rem;color:var(--ink-3);font-weight:500}
.kpi-note{font-size:.82rem;color:var(--ink-2)}
.kpi.hero{background:linear-gradient(135deg,#1b365d,#25497c);border-color:transparent;color:#fff}
.kpi.hero .kpi-label{color:#c9d6ea}.kpi.hero .kpi-note{color:#dfe7f4}
.up{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--good);background:var(--good-soft);padding:2px 8px;border-radius:999px;width:fit-content}
.kpi.hero .up{color:#0f3b25;background:#9de6bf}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:-6px}
.sec-head h2{font-size:1.15rem;font-weight:600}
.kpis.five{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.growth{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.g-pct{font-family:var(--f-display);font-size:2.2rem;font-weight:600;line-height:1.05;color:var(--good);font-variant-numeric:tabular-nums}
.g-what{font-size:.84rem;color:var(--ink-2);min-height:2.5em}
.g-bars{display:grid;gap:4px;margin-top:4px}
.g-bars span{display:block;height:6px;width:var(--w);border-radius:3px;background:var(--line)}
.g-bars span.now{background:var(--good)}
.g-range{font-size:.8rem;color:var(--ink-3)}
.g-range b{color:var(--good);font-weight:700}
.barlist{display:grid;gap:8px}
.bl{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border-radius:9px;background:var(--surface-2);overflow:hidden;font-size:.86rem;color:var(--ink)}
.bl::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--s1-soft);border-right:2px solid var(--s1)}
.bl span{position:relative;min-width:0}
.bl .pct{font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600;white-space:nowrap}
.logo-chips{display:flex;flex-wrap:wrap;gap:8px}
.logo-chips span{font-size:.84rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.logo-chips span small{font-weight:500;color:var(--ink-3);margin-left:4px}
.qsum{display:grid;gap:14px;min-height:260px;align-content:start}
#aiQ{min-height:200px}
.qsum-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.qsum-big{font-family:var(--f-display);font-size:2.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.qsum-lbl{font-size:.85rem;color:var(--ink-2)}
.qsum-note{font-size:.78rem;color:var(--ink-3)}
.qsum-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.qsum-tile{background:var(--surface-2);border-radius:10px;padding:12px}
.qsum-tile b{display:block;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.qsum-tile span{font-size:.78rem;color:var(--ink-2)}
/* Cards */
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid-2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.grid-2,.grid-2.even{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card h3{font-size:1.02rem;font-weight:600}
.card .sub{font-size:.82rem;color:var(--ink-3);margin-top:2px}
.chart{position:relative;height:260px}
.chart.tall{height:320px}
.chart.short{height:200px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;font:600 .78rem var(--f-body);color:var(--ink-2);padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:.8rem;background:var(--surface-2);border-radius:8px;padding:6px 10px;color:var(--ink-2)}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Insights list */
.insights{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.insights li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.9rem;color:var(--ink-2)}
.insights li b{color:var(--ink)}
.dot{width:22px;height:22px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-size:.75rem;font-weight:700;margin-top:1px}
.callout{background:var(--gold-soft);border-radius:12px;padding:14px 16px;font-size:.9rem;color:var(--ink)}
.callout b{font-family:var(--f-display);font-size:1.25rem;display:block}

/* Tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.q{font-weight:600;color:var(--ink)}
.path{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);display:block;margin-top:1px;word-break:break-all}
.rank{display:inline-block;min-width:44px;text-align:center;font-family:var(--f-mono);font-size:.74rem;padding:2px 6px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.minibar{height:6px;border-radius:3px;background:var(--s1);opacity:.85}
.tag{font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 .78rem var(--f-body);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}

/* Product tiles */
.prod-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.prod-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.prod-grid{grid-template-columns:minmax(0,1fr)}}
.prod{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.prod h4{margin:0;font-family:var(--f-display);font-size:1rem;font-weight:600}
.prod .what{font-size:.76rem;color:var(--ink-3);min-height:2.2em}
.prod .big{font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.prod .meta{font-size:.78rem;color:var(--ink-2)}
.prod .badge{margin-top:6px;width:fit-content;font-size:.7rem;font-weight:700;color:var(--good);background:var(--good-soft);padding:2px 8px;border-radius:999px}

.status{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.status.live{color:var(--good);background:var(--good-soft)}
.status.next{color:var(--gold);background:var(--gold-soft)}

footer{font-size:.75rem;color:var(--ink-3);padding-block:0 32px}
@media (max-width:560px){.kpi-value{font-size:1.6rem}.top-title span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Login gate */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-inline:16px;background:
  radial-gradient(ellipse at 20% 10%,var(--s1-soft),transparent 55%),var(--bg)}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 28px;display:grid;gap:18px}
.gate-card .logo{height:44px;justify-self:start}
.gate-card h1{font-size:1.4rem;font-weight:600}
.gate-card p{margin:4px 0 0;color:var(--ink-2);font-size:.9rem}
.field{display:grid;gap:6px}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.field input{font:inherit;font-size:.95rem;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.field input:focus{outline:2px solid var(--s1);outline-offset:1px;border-color:transparent}
.gate-btn{font:600 .95rem var(--f-body);padding:12px;border:0;border-radius:10px;background:var(--navy);color:var(--surface);cursor:pointer}
.gate-btn:disabled{opacity:.6;cursor:wait}
.gate-btn:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.gate-err{margin:0;font-size:.85rem;color:#e5484d;min-height:1.2em}
.gate-foot{font-size:.75rem;color:var(--ink-3)}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const form=document.getElementById('gateForm'), err=document.getElementById('gateErr'), btn=document.getElementById('gateBtn');
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const okEmail=e=>/^[^\s@]+@1cell\.ai$/i.test(e.trim());
async function unlock(pass){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
  return JSON.parse(new TextDecoder().decode(plain));
}
function show(data){
  document.getElementById('gate').remove();
  document.getElementById('app').innerHTML=data.html;
  const sc=document.createElement('script'); sc.textContent=data.js; document.body.appendChild(sc);
  const out=document.getElementById('signOutBtn');
  if(out){out.hidden=false; out.addEventListener('click',()=>{store.del('ws-auth');location.reload();});}
}
form.addEventListener('submit',async e=>{
  e.preventDefault(); err.textContent='';
  const email=document.getElementById('gateEmail').value, pass=document.getElementById('gatePass').value;
  if(!okEmail(email)){err.textContent='Use your @1cell.ai email address.';return;}
  if(!pass){err.textContent='Enter the password.';return;}
  btn.disabled=true; btn.textContent='Signing in…';
  try{ const data=await unlock(pass); store.set('ws-auth',pass); show(data); }
  catch(x){ err.textContent='That password is incorrect. Check it and try again.'; btn.disabled=false; btn.textContent='Sign in'; }
});
const saved=store.get('ws-auth');
if(saved) unlock(saved).then(show).catch(()=>store.del('ws-auth'));
})();

</script>
